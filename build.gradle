plugins { id 'java' }

group = 'es.mrdino'
version = '1.1.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

configurations {
    dialogCompileOnly
    paper261CompileOnly
    paper262CompileOnly
    paper263CompileOnly
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    dialogCompileOnly 'io.papermc.paper:paper-api:1.21.7-R0.1-SNAPSHOT'
    paper261CompileOnly 'io.papermc.paper:paper-api:26.1.2.build.74-stable'
    paper262CompileOnly 'io.papermc.paper:paper-api:26.2.build.124-stable'
    paper263CompileOnly 'io.papermc.paper:paper-api:26.3.build.223-stable'
    testImplementation 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    // Tests the server-wide log filter; never bundled into runtime plugin JARs.
    testImplementation 'org.apache.logging.log4j:log4j-core:2.26.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.properties(version: project.version, apiVersion: '1.20')
    filesMatching('plugin.yml') { expand(version: project.version, apiVersion: '1.20') }
}

tasks.jar {
    archiveBaseName = 'ServerPassword'
    archiveClassifier = '1.20.X'
}

tasks.withType(Jar).configureEach { from('LICENSE', 'NOTICE') }

def sourceDistribution = tasks.register('sourceDistribution', Zip) {
    archiveBaseName = 'ServerPassword'
    archiveClassifier = 'sources'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('src') { into 'src' }
    from('gradle') { into 'gradle' }
    from('tools') { into 'tools' }
    from 'build.gradle', 'settings.gradle', 'gradlew', 'gradlew.bat', 'README.md', 'LICENSE', 'NOTICE', '.gitignore'
}

def dialogClasses = tasks.register('compileDialogJava', JavaCompile) {
    source = fileTree('src/dialog/java')
    classpath = configurations.dialogCompileOnly + sourceSets.main.output
    destinationDirectory = layout.buildDirectory.dir('classes/java/dialog')
    options.release = 21
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    dependsOn tasks.named('classes')
}

def resources121 = tasks.register('process121Resources', Copy) {
    inputs.properties(version: project.version, apiVersion: '1.21')
    from sourceSets.main.resources
    into layout.buildDirectory.dir('resources/121')
    filesMatching('plugin.yml') { expand(version: project.version, apiVersion: '1.21') }
}

def jar121 = tasks.register('jar121', Jar) {
    archiveBaseName = 'ServerPassword'
    archiveClassifier = '1.21.X'
    from sourceSets.main.output.classesDirs
    from dialogClasses
    from resources121
    exclude 'previous-compilation-data.bin'
}

def releaseJars = [tasks.named('jar'), jar121]
['261': '26.1', '262': '26.2', '263': '26.3'].each { suffix, api ->
    def compiled = tasks.register("compilePaper${suffix}Java", JavaCompile) {
        source = files(fileTree('src/main/java') { exclude '**/LegacyPlatformAdapter.java' },
                fileTree('src/paper26/java'), fileTree('src/dialog/java'))
        classpath = configurations.getByName("paper${suffix}CompileOnly")
        destinationDirectory = layout.buildDirectory.dir("classes/java/paper${suffix}")
        options.release = 25
        javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
    }
    def resources = tasks.register("processPaper${suffix}Resources", Copy) {
        inputs.properties(version: project.version, apiVersion: api)
        from sourceSets.main.resources
        into layout.buildDirectory.dir("resources/paper${suffix}")
        filesMatching('plugin.yml') { expand(version: project.version, apiVersion: api) }
    }
    releaseJars.add(tasks.register("jarPaper${suffix}", Jar) {
        archiveBaseName = 'ServerPassword'
        archiveClassifier = "${api}.X"
        from compiled
        from resources
        exclude 'previous-compilation-data.bin'
    })
}

tasks.named('assemble') { dependsOn releaseJars, sourceDistribution }

def passwordToolClasses = tasks.register('compilePasswordTool', JavaCompile) {
    source = files('tools/HashPassword.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/java/passwordTool')
}
def passwordToolJar = tasks.register('passwordToolJar', Jar) {
    archiveFileName = 'ServerPassword-PasswordTool.jar'
    destinationDirectory = layout.buildDirectory.dir('tools')
    from passwordToolClasses
    manifest { attributes('Main-Class': 'HashPassword') }
}
tasks.named('assemble') { dependsOn passwordToolJar }
tasks.named('check') {
    dependsOn dialogClasses, 'compilePaper261Java', 'compilePaper262Java', 'compilePaper263Java'
}
tasks.named('test') { useJUnitPlatform() }

sourceSets {
    dialogTest {
        compileClasspath += sourceSets.main.output + files(dialogClasses)
        runtimeClasspath += sourceSets.main.output + files(dialogClasses)
    }
}

def paperDialogBackend = tasks.register('paperDialogBackend', Zip) {
    archiveBaseName = 'paper-dialog-test-backend'
    archiveVersion = ''
    archiveExtension = 'jar'
    destinationDirectory = layout.buildDirectory.dir('verification')
    // Isolate the real dialog provider from services that require a running Minecraft server.
    from {
        providers.gradleProperty('paperServerJar').isPresent()
                ? zipTree(file(providers.gradleProperty('paperServerJar').get())) : files()
    }
    include 'io/papermc/paper/registry/data/dialog/**'
    include 'net/minecraft/commands/functions/StringTemplate.class'
    include 'META-INF/services/io.papermc.paper.registry.data.dialog.DialogInstancesProvider'
    onlyIf { providers.gradleProperty('paperServerJar').isPresent() }
}

dependencies {
    dialogTestImplementation 'io.papermc.paper:paper-api:26.3.build.223-stable'
    dialogTestImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    dialogTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    dialogTestRuntimeOnly files(paperDialogBackend)
}

tasks.named('compileDialogTestJava', JavaCompile) {
    options.release = 25
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
}

def dialogTest = tasks.register('dialogTest', Test) {
    dependsOn tasks.named('test')
    description = 'Checks dialog construction against a real Paper server implementation supplied with -PpaperServerJar.'
    testClassesDirs = sourceSets.dialogTest.output.classesDirs
    classpath = sourceSets.dialogTest.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    useJUnitPlatform()
    onlyIf { providers.gradleProperty('paperServerJar').isPresent() }
}

tasks.named('check') { dependsOn dialogTest }

def protectionProbe = tasks.register('compileAuthProtectionProbe', JavaCompile) {
    source = fileTree('tools/integration') { include '*.java' }
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('classes/java/protectionProbe')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.register('authProtectionProbeJar', Jar) {
    archiveBaseName = 'AuthProtectionProbe'
    destinationDirectory = layout.buildDirectory.dir('integration/tools')
    from protectionProbe
    from('tools/integration/plugin.yml')
}
