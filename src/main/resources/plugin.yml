name: ServerPassword
version: '${version}'
main: es.mrdino.serverpassword.ServerPassPlugin
description: Server-wide password login with native dialogs and vanilla inventory screens.
authors: [MrDinoCarlos]
website: https://mrdino.es/server-password/
api-version: '${apiVersion}'
loadbefore:
  - PerPlayerProfiles
softdepend:
  - ViaVersion

commands:
  serverpass:
    description: Enter the server password
    usage: /serverpass
  spass:
    description: Admin commands for ServerPassword
    usage: /spass help

permissions:
  serverpassword.admin:
    default: op
